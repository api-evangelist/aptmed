name: APT Medical
description: >-
  APT Medical (Suzhou APT Medical Inc., Shanghai Stock Exchange STAR Market 688617.SH)
  is a Chinese interventional medical-device manufacturer specializing in
  electrophysiology and cardiovascular intervention. Its product portfolio spans
  electrophysiology navigation systems, navigated, mapping and ablation catheters,
  transseptal needles and steerable sheaths, interventional cardiology access,
  diagnostic and therapeutic products (guiding catheters, PTCA balloon catheters,
  guidewires), peripheral intervention devices, and OEM/ODM catheter and nitinol
  components. The company sells globally and publishes clinical cases, expert
  education, and investor relations material. It is a hardware medical-device
  manufacturer and does not currently expose a public developer API, developer
  portal, or machine-readable API artifacts. This profile was surfaced as a
  portfolio company of Qiming Venture Partners and enriched from public company
  properties.
